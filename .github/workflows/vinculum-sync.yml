name: Vinculum API Sync

on:
  workflow_dispatch:

jobs:
  test-vinculum-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Check API key
        env:
          VINCULUM_API_KEY: ${{ secrets.VINCULUM_API_KEY }}
        run: |
          if [ -z "$VINCULUM_API_KEY" ]; then
            echo "VINCULUM_API_KEY secret is missing"
            exit 1
          fi
          echo "Vinculum API key is configured."

      - name: Call Vinculum Order API
        env:
          VINCULUM_API_KEY: ${{ secrets.VINCULUM_API_KEY }}
        run: |
          curl -sS -X POST \
            "https://physicswallah.vineretail.com/eRetailWeb/order/list" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Authorization: Bearer $VINCULUM_API_KEY" \
            --data-urlencode "_search=true" \
            --data-urlencode "rows=20" \
            --data-urlencode "page=1" \
            --data-urlencode "sord=asc" \
            --data-urlencode "siteLoc=M10%17M09%17M16%17M21%17M08%17PWH" \
            --data-urlencode "fromOrderDate=11/08/2026" \
            --data-urlencode "toOrderDate=25/08/2026"
