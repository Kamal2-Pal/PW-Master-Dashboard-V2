name: Vinculum API Sync

on:
  workflow_dispatch:
  schedule:
    # Runs every 4 hours (UTC). GitHub Actions cron times are always UTC,
    # so this is roughly 5:30am, 9:30am, 1:30pm, 5:30pm, 9:30pm, 1:30am IST.
    # Adjust the interval below if you want it more/less frequent.
    - cron: "0 */4 * * *"

jobs:
  test-vinculum-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Check API key
        env:
          VINCULUM_API_KEY: ${{ secrets.VINCULUM_API_KEY }}
        run: |
          if [ -z "$VINCULUM_API_KEY" ]; then
            echo "VINCULUM_API_KEY secret is missing"
            exit 1
          fi
          echo "Vinculum API key is configured."

      - name: Call Vinculum Order API
        env:
          VINCULUM_API_KEY: ${{ secrets.VINCULUM_API_KEY }}
        run: |
          curl -sS -X POST \
            "https://physicswallah.vineretail.com/RestWS/api/eretail/v2/order/list" \
            -H "Content-Type: application/json" \
            -H "ApiKey: $VINCULUM_API_KEY" \
            -H "ApiOwner: Kamal.Pal" \
            -d '{
              "pageNo": 1,
              "pageSize": 20
            }'
