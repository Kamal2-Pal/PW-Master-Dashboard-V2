name: Vinculum API Sync

on:
  workflow_dispatch:

jobs:
  test-vinculum-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Check API key
        env:
          VINCULUM_API_KEY: ${{ secrets.VINCULUM_API_KEY }}
        run: |
          if [ -z "$VINCULUM_API_KEY" ]; then
            echo "VINCULUM_API_KEY secret is missing"
            exit 1
          fi
          echo "Vinculum API key is configured."

      - name: Check endpoint
        run: |
          echo "Vinculum Order endpoint configured: /order/list"
