name: Vinculum Picker Report

on:
  schedule:
    # Daily at 8:30 AM IST
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picker-report-sync
  cancel-in-progress: false

jobs:
  extract-picker-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VINCULUM_USERNAME: ${{ secrets.VINCULUM_USERNAME }}
      VINCULUM_PASSWORD: ${{ secrets.VINCULUM_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Run Picker Report Extract
        id: picker
        run: |
          python "vinculum_picker_extract.py"

      - name: Upload Picker failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: picker-failure-${{ github.run_id }}
          path: |
            picker_failure.html
            *.png
            *.html
            *.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit Picker data
        if: steps.picker.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/picker_live.csv
          git add data/picker_history.csv
          git add data/picker_raw_last3days.csv
          git add data/picker-meta.json

          if git diff --cached --quiet; then
            echo "No Picker data changes to commit."
            exit 0
          fi

          git commit -m "Auto update Picker Report"
          git push origin main
