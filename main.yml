name: Vinculum Auto Extract
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vinculum-data-commit
  cancel-in-progress: false
jobs:
  extract-vinculum-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VINCULUM_USERNAME: ${{ secrets.VINCULUM_USERNAME }}
      VINCULUM_PASSWORD: ${{ secrets.VINCULUM_PASSWORD }}
      VINCULUM_DATE_MODE: CURRENT_MONTH
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium openpyxl

      - name: Run Vinculum Extract
        id: extract
        run: |
          python "vinculum_extract_final.py"

      # Runs ONLY if the extract step above failed - uploads whatever
      # screenshot/page-source/log the script may have saved on error, as a
      # downloadable Actions artifact, so a failure can actually be diagnosed.
      - name: Upload failure diagnostics
        if: failure() && steps.extract.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: vinculum-extract-failure-${{ github.run_id }}
          path: |
            *.png
            *.html
            *.log
          if-no-files-found: ignore
          retention-days: 7

      # Sends the Open Orders (Open <48H + At Risk + Open >48H) summary email
      # via Brevo. Only runs if extraction actually succeeded - a failed
      # extraction means data.xlsx wasn't refreshed, so sending an alert off
      # stale/partial data would be misleading.
      - name: Send Open Orders email alert
        if: steps.extract.outcome == 'success'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
        run: |
          python "send_open_orders_alert.py"

      - name: Commit updated data.xlsx
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.xlsx data-meta.json

          if git diff --cached --quiet; then
            echo "No changes to data.xlsx - nothing to commit (extract may have produced identical data, or failed before this point)."
            exit 0
          fi

          git commit -m "Auto update Vinculum data"

          # The push can be rejected if another run (a scheduled run and a
          # manual run overlapping, for example) pushed to main first while
          # this job was busy scraping Vinculum. That used to make the whole
          # commit silently vanish - the extraction succeeded but the commit
          # never landed, so data.xlsx (and "Last Sync") just stayed stale.
          # Retry with a rebase onto the latest remote main a few times
          # instead of failing outright.
          max_attempts=5
          attempt=1
          until git push origin main; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Push still failing after $max_attempts attempts - giving up."
              exit 1
            fi
            echo "Push rejected (remote moved on) - fetching + rebasing, attempt $attempt/$max_attempts..."
            git fetch origin main
            git rebase origin/main
            attempt=$((attempt + 1))
          done

          echo "Committed and pushed updated data.xlsx."
